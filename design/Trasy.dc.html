<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: oklch(0.16 0.014 255); font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: oklch(0.80 0.13 200); text-decoration: none; }
    a:hover { color: oklch(0.88 0.10 200); }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
    .disp { font-family: "Bricolage Grotesque", Archivo, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: oklch(0.16 0.014 255); color: oklch(0.96 0.005 255); overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 20px 16px 6px;">
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.13 200)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 6.4-9.6 3.6 4.6 3.2-4.4L22 19H2z"/></svg>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.80 0.13 200);">NAVRCHOL</div>
      </div>
      <div class="disp" style="font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1;">Moje trasy</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: oklch(0.80 0.13 200); display: flex; align-items: center; justify-content: center; color: oklch(0.18 0.03 220);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </div>
  </div>
  <div class="mono" style="padding: 0 16px 16px; font-size: 11px; color: oklch(0.56 0.014 255); letter-spacing: 0.02em;">aktualizováno 06:14 · ICON-D2 + 3 modely</div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; overflow: hidden;">
    <sc-for list="{{routes}}" as="r" hint-placeholder-count="4">
      <div style="padding: 14px; border-radius: 16px; background: oklch(0.215 0.016 255); display: flex; gap: 13px; align-items: stretch;">
        <div style="width: 58px; flex-shrink: 0; border-radius: 12px; background: {{r.chipBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
          <div class="mono" style="font-size: 23px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: {{r.color}};">{{r.score}}</div>
          <div class="mono" style="font-size: 8px; font-weight: 700; letter-spacing: 0.12em; color: {{r.color}};">{{r.word}}</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
          <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2;">{{r.name}}</div>
          <div class="mono" style="font-size: 11px; color: oklch(0.62 0.014 255); letter-spacing: 0.01em;">{{r.stats}}</div>
          <div style="display: flex; align-items: center; gap: 5px; margin-top: 1px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{r.color}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div style="font-size: 12px; font-weight: 500; color: {{r.color}};">{{r.window}}</div>
          </div>
        </div>
      </div>
    </sc-for>

    <div style="margin-top: 4px; padding: 15px; border-radius: 16px; border: 1px dashed oklch(0.34 0.02 255); display: flex; align-items: center; justify-content: center; gap: 9px; color: oklch(0.62 0.014 255);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <span style="font-size: 14px; font-weight: 600;">Nová trasa</span>
    </div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 9px 4px 20px; border-top: 1px solid oklch(0.26 0.018 255); background: oklch(0.175 0.014 255);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.80 0.13 200);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4z"/><path d="M9 4v14"/><path d="M15 6.5v14"/></svg>
      <span style="font-size: 9.5px; font-weight: 600;">Trasy</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 6.4-9.6 3.6 4.6 3.2-4.4L22 19H2z"/><circle cx="17.5" cy="5.5" r="2.5"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Verdikt</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Kdy jít</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3.4"/><path d="M5.5 8.5 7.9 10.9"/><path d="M18.5 8.5 16.1 10.9"/><path d="M2.5 17.5h19"/><path d="M6.8 17.5a5.2 5.2 0 0 1 10.4 0"/><path d="M9.2 20.8h5.6"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Slunce</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M9 13h6"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Výbava</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const GO = 'oklch(0.78 0.16 152)';
    const WARN = 'oklch(0.80 0.15 78)';
    const STOP = 'oklch(0.66 0.20 25)';
    return {
      routes: [
        { name: 'Sněžka z Pece', stats: '12,4 km · ↑ 940 m · 4 h 20 min', score: 84, word: 'JDI', color: GO, chipBg: 'oklch(0.25 0.05 152)', window: 'ne 7:00–13:00' },
        { name: 'Praděd přes Švýcárnu', stats: '9,1 km · ↑ 520 m · 3 h 10 min', score: 61, word: 'ZVAŽ', color: WARN, chipBg: 'oklch(0.25 0.05 78)', window: 'st 9:00–14:00' },
        { name: 'Kozí hřbety', stats: '7,8 km · ↑ 430 m · 2 h 45 min', score: 28, word: 'NEJDI', color: STOP, chipBg: 'oklch(0.25 0.06 25)', window: 'celý týden bouřky' },
        { name: 'Ostrý ze Železné Rudy', stats: '11,2 km · ↑ 610 m · 3 h 50 min', score: 72, word: 'JDI', color: GO, chipBg: 'oklch(0.25 0.05 152)', window: 'pá 8:00–15:00' }
      ]
    };
  }
}
</script>
</body>
</html>
