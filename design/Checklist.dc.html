<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: oklch(0.16 0.014 255); font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: oklch(0.80 0.13 200); text-decoration: none; }
    a:hover { color: oklch(0.88 0.10 200); }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
    .disp { font-family: "Bricolage Grotesque", Archivo, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: oklch(0.16 0.014 255); color: oklch(0.96 0.005 255); overflow: hidden;">

  <div style="padding: 24px 16px 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div class="disp" style="font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1;">Výbava</div>
    <div class="mono" style="font-size: 12px; font-weight: 700; color: oklch(0.80 0.13 200);">9 / 12</div>
  </div>
  <div style="padding: 10px 16px 0;">
    <div style="height: 5px; border-radius: 3px; background: oklch(0.26 0.018 255); overflow: hidden;">
      <div style="width: 75%; height: 100%; border-radius: 3px; background: oklch(0.80 0.13 200);"></div>
    </div>
  </div>
  <div class="mono" style="padding: 8px 16px 14px; font-size: 11px; color: oklch(0.56 0.014 255); letter-spacing: 0.02em;">Sněžka z Pece · ne 20. 9. · 07:00</div>

  <!-- weather-driven -->
  <div style="padding: 0 16px; display: flex; align-items: center; gap: 7px; padding-bottom: 8px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.13 200)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="3.6"/></svg>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: oklch(0.80 0.13 200);">PŘIDÁNO PODLE POČASÍ</div>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 6px;">
    <sc-for list="{{auto}}" as="a" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: oklch(0.215 0.022 220);">
        <div style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; background: {{a.boxBg}}; border: 1.5px solid {{a.boxBorder}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{a.done}}" hint-placeholder-val="{{true}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.18 0.03 220)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </sc-if>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 14px; font-weight: 600; color: {{a.textColor}};">{{a.name}}</div>
          <div class="mono" style="font-size: 10px; color: oklch(0.66 0.05 220); letter-spacing: 0.01em;">{{a.why}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- base list -->
  <div style="padding: 18px 16px 8px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: oklch(0.56 0.014 255);">MŮJ ZÁKLAD</div>
    <div class="mono" style="font-size: 10.5px; color: oklch(0.80 0.13 200);">upravit</div>
  </div>
  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 5px; overflow: hidden;">
    <sc-for list="{{base}}" as="b" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 11px; background: oklch(0.198 0.015 255);">
        <div style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; background: {{b.boxBg}}; border: 1.5px solid {{b.boxBorder}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{b.done}}" hint-placeholder-val="{{true}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.18 0.03 220)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </sc-if>
        </div>
        <div style="flex-grow: 1; font-size: 14px; font-weight: 500; color: {{b.textColor}}; text-decoration: {{b.strike}};">{{b.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 9px 4px 20px; border-top: 1px solid oklch(0.26 0.018 255); background: oklch(0.175 0.014 255);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4z"/><path d="M9 4v14"/><path d="M15 6.5v14"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Trasy</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 6.4-9.6 3.6 4.6 3.2-4.4L22 19H2z"/><circle cx="17.5" cy="5.5" r="2.5"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Verdikt</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Kdy jít</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.56 0.014 255);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3.4"/><path d="M5.5 8.5 7.9 10.9"/><path d="M18.5 8.5 16.1 10.9"/><path d="M2.5 17.5h19"/><path d="M6.8 17.5a5.2 5.2 0 0 1 10.4 0"/><path d="M9.2 20.8h5.6"/></svg>
      <span style="font-size: 9.5px; font-weight: 500;">Slunce</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 46px; justify-content: center; color: oklch(0.80 0.13 200);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M9 13h6"/></svg>
      <span style="font-size: 9.5px; font-weight: 600;">Výbava</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ACC = 'oklch(0.80 0.13 200)';
    const mk = (name, done, extra) => Object.assign({
      name: name,
      done: done,
      boxBg: done ? ACC : 'transparent',
      boxBorder: done ? ACC : 'oklch(0.38 0.02 255)',
      textColor: done ? 'oklch(0.60 0.014 255)' : 'oklch(0.96 0.005 255)',
      strike: done ? 'line-through' : 'none'
    }, extra || {});

    return {
      auto: [
        mk('Větrovka', true, { why: 'nárazy 58 km/h na hřebeni' }),
        mk('Čepice a rukavice', true, { why: 'pocitově −2 °C na vrcholu' }),
        mk('Pláštěnka', false, { why: 'srážky 0,4 mm, pravděpodobnost 20 %' }),
        mk('Termoska s čajem', false, { why: 'na vrcholu −2 °C a nárazy 58 km/h' })
      ],
      base: [
        mk('Voda 2 l', true),
        mk('Offline mapa', true),
        mk('Lékárnička', true),
        mk('Svačina na celý den', true),
        mk('Powerbanka', true),
        mk('Hůlky', false),
        mk('Nůž', true),
        mk('Hotovost na chatu', true)
      ]
    };
  }
}
</script>
</body>
</html>
