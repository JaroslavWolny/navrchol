<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: oklch(0.16 0.014 255); font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: oklch(0.80 0.13 200); text-decoration: none; }
    a:hover { color: oklch(0.88 0.10 200); }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
    .disp { font-family: "Bricolage Grotesque", Archivo, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: oklch(0.16 0.014 255); color: oklch(0.96 0.005 255); overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 16px 12px;">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.012 255)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M15 5l-7 7 7 7"/></svg>
      <div class="disp" style="font-size: 19px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Sněžka z Pece</div>
    </div>
    <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: oklch(0.80 0.13 200); color: oklch(0.18 0.03 220); display: flex; align-items: center; font-size: 13px; font-weight: 700;">Uložit</div>
  </div>

  <!-- map -->
  <div style="position: relative; margin: 0 16px; height: 268px; border-radius: 18px; overflow: hidden; background: oklch(0.195 0.018 250); border: 1px solid oklch(0.30 0.02 255);">
    <svg width="358" height="268" viewBox="0 0 358 268" style="position: absolute; inset: 0;" aria-hidden="true">
      <g fill="none" stroke="oklch(0.78 0.05 200)" stroke-width="1">
        <ellipse cx="252" cy="88" rx="172" ry="128" opacity="0.10" transform="rotate(24 252 88)"/>
        <ellipse cx="252" cy="88" rx="146" ry="108" opacity="0.11" transform="rotate(22 252 88)"/>
        <ellipse cx="252" cy="88" rx="120" ry="89" opacity="0.13" transform="rotate(20 252 88)"/>
        <ellipse cx="252" cy="88" rx="95" ry="70" opacity="0.15" transform="rotate(18 252 88)"/>
        <ellipse cx="252" cy="88" rx="70" ry="51" opacity="0.18" transform="rotate(16 252 88)"/>
        <ellipse cx="252" cy="88" rx="46" ry="33" opacity="0.22" transform="rotate(14 252 88)"/>
        <ellipse cx="252" cy="88" rx="24" ry="17" opacity="0.28" transform="rotate(12 252 88)"/>
        <ellipse cx="74" cy="206" rx="84" ry="52" opacity="0.10" transform="rotate(-18 74 206)"/>
        <ellipse cx="74" cy="206" rx="58" ry="36" opacity="0.13" transform="rotate(-20 74 206)"/>
        <ellipse cx="74" cy="206" rx="32" ry="20" opacity="0.17" transform="rotate(-22 74 206)"/>
      </g>
      <path d="M0 232 C60 224 96 240 148 232 C204 223 250 244 300 234 L358 240" fill="none" stroke="oklch(0.70 0.09 230)" stroke-width="2" opacity="0.28"/>
      <path d="M44 244 C82 220 108 196 150 172 C196 146 222 120 248 94" fill="none" stroke="oklch(0.16 0.014 255)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <path d="M248 94 C276 124 296 158 302 192 C240 226 150 250 62 250" fill="none" stroke="oklch(0.16 0.014 255)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <path d="M44 244 C82 220 108 196 150 172 C196 146 222 120 248 94" fill="none" stroke="oklch(0.80 0.13 200)" stroke-width="3" stroke-linecap="round"/>
      <path d="M248 94 C276 124 296 158 302 192 C240 226 150 250 62 250" fill="none" stroke="oklch(0.80 0.13 200)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
      <g class="mono">
        <circle cx="44" cy="244" r="12" fill="oklch(0.16 0.014 255)" stroke="oklch(0.80 0.13 200)" stroke-width="2"/>
        <text x="44" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="oklch(0.90 0.05 200)" font-family="JetBrains Mono, monospace">1</text>
        <circle cx="150" cy="172" r="12" fill="oklch(0.16 0.014 255)" stroke="oklch(0.80 0.13 200)" stroke-width="2"/>
        <text x="150" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="oklch(0.90 0.05 200)" font-family="JetBrains Mono, monospace">2</text>
        <circle cx="248" cy="94" r="15" fill="oklch(0.80 0.13 200)"/>
        <text x="248" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="oklch(0.18 0.03 220)" font-family="JetBrains Mono, monospace">3</text>
        <circle cx="302" cy="192" r="12" fill="oklch(0.16 0.014 255)" stroke="oklch(0.80 0.13 200)" stroke-width="2"/>
        <text x="302" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="oklch(0.90 0.05 200)" font-family="JetBrains Mono, monospace">4</text>
      </g>
      <text x="248" y="64" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.4" fill="oklch(0.78 0.04 200)" font-family="JetBrains Mono, monospace" opacity="0.75">1603</text>
    </svg>
    <div class="mono" style="position: absolute; left: 12px; bottom: 10px; font-size: 9px; letter-spacing: 0.1em; color: oklch(0.60 0.03 230); opacity: 0.8;">ŤUKNUTÍM DO MAPY PŘIDÁŠ BOD</div>
  </div>

  <!-- route stats -->
  <div style="display: flex; gap: 7px; padding: 12px 16px 0;">
    <div style="flex-grow: 1; padding: 9px 10px; border-radius: 11px; background: oklch(0.215 0.016 255); display: flex; flex-direction: column; gap: 2px; align-items: center;">
      <div class="mono" style="font-size: 15px; font-weight: 700;">12,4 km</div>
      <div style="font-size: 9.5px; color: oklch(0.56 0.014 255); letter-spacing: 0.04em;">DÉLKA</div>
    </div>
    <div style="flex-grow: 1; padding: 9px 10px; border-radius: 11px; background: oklch(0.215 0.016 255); display: flex; flex-direction: column; gap: 2px; align-items: center;">
      <div class="mono" style="font-size: 15px; font-weight: 700;">940 m</div>
      <div style="font-size: 9.5px; color: oklch(0.56 0.014 255); letter-spacing: 0.04em;">STOUPÁNÍ</div>
    </div>
    <div style="flex-grow: 1; padding: 9px 10px; border-radius: 11px; background: oklch(0.215 0.016 255); display: flex; flex-direction: column; gap: 2px; align-items: center;">
      <div class="mono" style="font-size: 15px; font-weight: 700;">4 h 20 min</div>
      <div style="font-size: 9.5px; color: oklch(0.56 0.014 255); letter-spacing: 0.04em;">ODHAD</div>
    </div>
  </div>

  <!-- start + tempo -->
  <div style="display: flex; gap: 8px; padding: 8px 16px 0; align-items: stretch;">
    <div style="width: 118px; flex-shrink: 0; padding: 9px 12px; border-radius: 12px; background: oklch(0.215 0.016 255); display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 9.5px; color: oklch(0.56 0.014 255); letter-spacing: 0.04em;">START</div>
      <div class="mono" style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">07:00</div>
    </div>
    <div style="flex-grow: 1; padding: 9px 10px; border-radius: 12px; background: oklch(0.215 0.016 255); display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9.5px; color: oklch(0.56 0.014 255); letter-spacing: 0.04em;">TEMPO</div>
      <div style="display: flex; gap: 4px;">
        <div style="flex-grow: 1; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 500; color: oklch(0.62 0.014 255);">Pomalé</div>
        <div style="flex-grow: 1; height: 26px; border-radius: 7px; background: oklch(0.80 0.13 200); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: oklch(0.18 0.03 220);">Střední</div>
        <div style="flex-grow: 1; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 500; color: oklch(0.62 0.014 255);">Svižné</div>
      </div>
    </div>
  </div>

  <!-- waypoints -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; padding: 14px 16px 0; overflow: hidden;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: oklch(0.56 0.014 255);">BODY TRASY</div>
      <div class="mono" style="font-size: 10.5px; color: oklch(0.80 0.13 200);">+ přidat</div>
    </div>
    <sc-for list="{{wps}}" as="w" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 11px; padding: 8px 11px; border-radius: 11px; background: oklch(0.205 0.016 255);">
        <div class="mono" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; border: 1.5px solid {{w.ring}}; color: {{w.ring}}; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700;">{{w.n}}</div>
        <div style="flex-grow: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{w.name}}</div>
        <div class="mono" style="font-size: 11.5px; color: oklch(0.62 0.014 255); flex-shrink: 0;">{{w.alt}}</div>
        <div class="mono" style="font-size: 12.5px; font-weight: 700; color: oklch(0.80 0.13 200); flex-shrink: 0; width: 42px; text-align: right;">{{w.time}}</div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 22px;">
    <div style="height: 50px; border-radius: 14px; background: oklch(0.80 0.13 200); color: oklch(0.18 0.03 220); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 6.4-9.6 3.6 4.6 3.2-4.4L22 19H2z"/></svg>
      Spočítat verdikt
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ACC = 'oklch(0.80 0.13 200)';
    const DIM = 'oklch(0.45 0.02 255)';
    return {
      wps: [
        { n: '1', name: 'Pec pod Sněžkou', alt: '769 m', time: '07:00', ring: DIM },
        { n: '2', name: 'Růžová hora', alt: '1 390 m', time: '08:35', ring: DIM },
        { n: '3', name: 'Sněžka', alt: '1 603 m', time: '09:20', ring: ACC },
        { n: '4', name: 'Obří důl', alt: '1 010 m', time: '10:50', ring: DIM }
      ]
    };
  }
}
</script>
</body>
</html>
