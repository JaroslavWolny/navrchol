<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>NaVrchol — výbava</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 940px; position: relative; overflow: hidden; box-sizing: border-box; background: #E9EBE6; color: #0E1210; font-family: Archivo, system-ui, sans-serif">

  <header style="padding: 58px 22px 0">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <h1 style="margin: 0; font-size: 54px; line-height: 0.9; font-weight: 800; font-stretch: 70%; letter-spacing: -0.015em">Výbava</h1>
      <div aria-live="polite" style="font-size: 40px; line-height: 0.9; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums">{{done}}<span style="color: #9AA29C">/{{total}}</span></div>
    </div>
    <div style="margin-top: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #5C645F">Červená hora ze sedla · zítra 15:00</div>
    <div aria-hidden="true" style="margin-top: 18px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="7">
        <span style="height: 6px; border-radius: 3px; background: {{s.bg}}"></span>
      </sc-for>
    </div>
  </header>

  <main style="padding: 0 16px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; margin: 34px 0 12px">
      <h2 style="margin: 0; font-size: 30px; line-height: 1; font-weight: 800; font-stretch: 70%; letter-spacing: -0.01em">Kvůli počasí</h2>
    </div>
    <div style="border-radius: 22px; background: #F7F8F5; padding: 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #C8F169; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 650">Nic navíc</span>
        <span style="font-size: 12.5px; color: #5C645F">Počasí si nic nevynutilo, stačí základ.</span>
      </span>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; margin: 34px 0 12px">
      <h2 style="margin: 0; font-size: 30px; line-height: 1; font-weight: 800; font-stretch: 70%; letter-spacing: -0.01em">Vždycky</h2>
      <button type="button" style="border: 0; background: transparent; padding: 10px 0 10px 12px; margin: -10px 0; color: #0E1210; font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Upravit</button>
    </div>
    <div style="border-radius: 22px; background: #F7F8F5; padding: 4px 8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{it.pressed}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 56px; border: 0; border-bottom: {{it.border}}; background: transparent; color: #0E1210; display: flex; align-items: center; gap: 14px; padding: 0 8px; font-family: inherit; text-align: left">
          <span style="width: 26px; height: 26px; flex: none; border-radius: 8px; box-sizing: border-box; background: {{it.boxBg}}; box-shadow: {{it.boxRing}}; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{it.tick}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </span>
          <span style="flex: 1; font-size: 16px; font-weight: 500; color: {{it.color}}; text-decoration: {{it.strike}}">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, rgba(233,235,230,0), #E9EBE6 60%)"></div>
  <nav aria-label="Hlavní navigace" style="position: absolute; left: 14px; right: 14px; bottom: 22px; height: 68px; border-radius: 24px; background: #0E1210; box-shadow: 0 18px 40px -18px rgba(14,18,16,0.55); box-sizing: border-box; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <a href="Trasy.dc.html" style="border-radius: 18px; color: #A8B0AA; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2.25"></circle><circle cx="18" cy="18.5" r="2.25"></circle><path d="M8.2 5.5h6.3a3.25 3.25 0 0 1 0 6.5h-5a3.25 3.25 0 0 0 0 6.5h6.3"></path></svg>
      <span>Trasy</span>
    </a>
    <a href="Verdikt.dc.html" style="border-radius: 18px; color: #A8B0AA; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 19.5 9 8.5l3.6 6 2.4-3.6 6.5 8.6z"></path><path d="M9 8.5V3.5l3.2 1.3L9 6.1"></path></svg>
      <span>Verdikt</span>
    </a>
    <a href="KdyJit.dc.html" style="border-radius: 18px; color: #A8B0AA; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4M8 14.5h3"></path></svg>
      <span>Kdy jít</span>
    </a>
    <a href="Slunce.dc.html" style="border-radius: 18px; color: #A8B0AA; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17.5h18M6.5 17.5a5.5 5.5 0 0 1 11 0M12 5v3M4.6 9.6l2 2M19.4 9.6l-2 2M8 21h8"></path></svg>
      <span>Slunce</span>
    </a>
    <a href="Vybava.dc.html" aria-current="page" style="border-radius: 18px; background: #C8F169; color: #0E1210; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 650">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9A5.5 5.5 0 0 1 17.5 9v10a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 19z"></path><path d="M9.5 5.2V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v.4M9.5 14h5v3h-5z"></path></svg>
      <span>Výbava</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checked: [true, true, false, false, false, false, false] };
  }
  renderVals() {
    const labels = ['Voda 1,5 l', 'Offline mapa v telefonu', 'Lékárnička', 'Svačina', 'Teplá vrstva navíc', 'Powerbanka', 'Hotovost na chatu'];
    const ch = this.state.checked;
    const items = labels.map((label, i) => {
      const on = ch[i];
      return {
        label,
        pressed: on ? 'true' : 'false',
        boxBg: on ? '#0E1210' : 'transparent',
        boxRing: on ? 'none' : 'inset 0 0 0 1.75px #B2B9B0',
        tick: on ? '#C8F169' : 'transparent',
        color: on ? '#5C645F' : '#0E1210',
        strike: on ? 'line-through' : 'none',
        border: i < labels.length - 1 ? '1px solid #DCE0D9' : '0',
        toggle: () => {
          const next = ch.slice();
          next[i] = !next[i];
          this.setState({ checked: next });
        }
      };
    });
    const done = ch.filter(Boolean).length;
    const segments = ch.map((_, i) => ({ bg: i < done ? '#0E1210' : '#D2D7D0' }));
    return { items, done: String(done), total: String(labels.length), segments };
  }
}
</script>
</body>
</html>
