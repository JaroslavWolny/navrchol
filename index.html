<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d100e" />
    <meta name="description" content="Nejpřesnější počasí na túru: verdikt, kdy jít, a co si vzít." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Neprůhledná lišta, ne black-translucent. S ní iOS appce zkrátil okno
      o horní bezpečnou zónu (naměřeno 393x793 místo 393x852), ale zónu dál
      hlásil jako 59px — appka ji tak započítala podruhé a dole zbýval
      neobarvený pruh, kam webové okno vůbec nedosáhne.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Jedna nadrodina ve třech hlasech: Sans na text, Condensed na verdikt
      a nadpisy (písmo horské cedule), Mono na naměřené hodnoty. Díky společné
      kostře sedí číslo v tabulce opticky k popisce vedle sebe.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap"
    />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NaVrchol" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="NaVrchol — jít, nebo nejít?" />
    <meta
      property="og:description"
      content="Počasí na túru, které ti dá rozhodnutí místo obrázku sluníčka. Čtyři modely naráz, skutečná pěšina, a řekne ti, v kolik vyrazit."
    />
    <meta property="og:image" content="https://navrchol.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://navrchol.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>NaVrchol — jít, nebo nejít?</title>
